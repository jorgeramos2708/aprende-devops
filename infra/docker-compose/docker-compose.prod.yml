version: "3.9"

services:
  # ----------------------------------------------------------
  # REVERSE PROXY + SSL TERMINATION (Cloudflare Tunnel handles public SSL)
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: platform-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"  # Cloudflare Tunnel connects here
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro  # optional: self-signed for local dev
    networks:
      - platform-internal
    depends_on:
      - api
      - web

  # ----------------------------------------------------------
  # BACKEND API (.NET 9)
  # ----------------------------------------------------------
  api:
    image: devops-platform/api:latest
    container_name: platform-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__Default=Host=postgres;Database=devops_platform;Username=postgres;Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - MinIO__Endpoint=minio:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD}
      - MinIO__Bucket=devops-platform
      - OpenIddict__Authority=http://api:8080
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=devops-platform
      - Jwt__Audience=devops-platform
      - AllowedOrigins__0=https://aprende-devops.edrs.xyz
      - AllowedOrigins__1=http://localhost:5173
    volumes:
      - app-data:/app/data
    networks:
      - platform-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  # ----------------------------------------------------------
  # FRONTEND (React + Vite + Nginx static serve)
  # ----------------------------------------------------------
  web:
    image: devops-platform/web:latest
    container_name: platform-web
    restart: unless-stopped
    networks:
      - platform-internal
    # Built with: npm run build && docker build -f Dockerfile.web -t devops-platform/web:latest .

  # ----------------------------------------------------------
  # POSTGRESQL 16 + pgvector + pg_trgm
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=devops_platform
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - platform-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
        reservations:
          cpus: "0.5"
          memory: "1G"

  # ----------------------------------------------------------
  # REDIS 7 (Stack) - cache, streams, pub/sub
  # ----------------------------------------------------------
  redis:
    image: redis/redis-stack:7.2.0-v11
    container_name: platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - platform-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: "1G"

  # ----------------------------------------------------------
  # MINIO (S3-compatible object storage)
  # ----------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-20T16-11-10Z
    container_name: platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - platform-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: "1G"

  # ----------------------------------------------------------
  # GRAFANA STACK (Alloy + Loki + Prometheus + Tempo + Grafana)
  # ----------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.5.0
    container_name: platform-alloy
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - platform-internal
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]

  loki:
    image: grafana/loki:2.9.4
    container_name: platform-loki
    restart: unless-stopped
    volumes:
      - loki-data:/loki
    networks:
      - platform-internal

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: platform-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - platform-internal
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  tempo:
    image: grafana/tempo:2.4.1
    container_name: platform-tempo
    restart: unless-stopped
    volumes:
      - tempo-data:/var/tempo
    networks:
      - platform-internal
    command:
      - "-config.file=/etc/tempo.yaml"
    # Note: tempo config via volume in real setup

  grafana:
    image: grafana/grafana:10.4.1
    container_name: platform-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.edrs.xyz
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - platform-internal
    depends_on:
      - loki
      - prometheus
      - tempo

  # ----------------------------------------------------------
  # WORKERS (Hangfire: limpieza, insights, regresiones)
  # ----------------------------------------------------------
  workers:
    image: devops-platform/workers:latest
    container_name: platform-workers
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Database=devops_platform;Username=postgres;Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
    networks:
      - platform-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"

  # ----------------------------------------------------------
  # TECHWATCHER (revisiones cada 6h de docs oficiales)
  # ----------------------------------------------------------
  techwatcher:
    image: devops-platform/techwatcher:latest
    container_name: platform-techwatcher
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=postgres;Database=devops_platform;Username=postgres;Password=${POSTGRES_PASSWORD}
    networks:
      - platform-internal
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "64M"

  # ----------------------------------------------------------
  # CLOUDFLARE TUNNEL (runs on host, not in compose - see systemd)
  # ----------------------------------------------------------
  # cloudflared runs as systemd service on host VM

networks:
  platform-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  postgres-data:
  redis-data:
  minio-data:
  loki-data:
  prometheus-data:
  tempo-data:
  grafana-data:
  app-data:
