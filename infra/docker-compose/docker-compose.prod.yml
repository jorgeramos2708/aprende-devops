# ============================================================================
# Aprende DevOps - Stack de produccion (VPS Contabo)
#
# Se despliega en /opt/aprende-devops junto al checkout del repo:
#   docker compose -f infra/docker-compose/docker-compose.prod.yml up -d
#
# Alcance: SOLO la plataforma. Caddy, Zot, Uptime Kuma y Vaultwarden ya corren
# en el VPS (fuera de este archivo) y comparten la red externa `caddy_net`.
# Ningun servicio de aqui publica puertos al host: Caddy enruta por nombre.
#
# Perfiles:
#   (default)  nucleo funcional
#   obs        observabilidad ligera (cadvisor + prometheus + grafana)
# ============================================================================

name: aprende-devops

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-restart-secure: &base-policy
  restart: unless-stopped
  security_opt: [ "no-new-privileges:true" ]

networks:
  proxy:              # la red del contenedor Caddy existente en el VPS
    external: true
    name: caddy_net
  internal:
    driver: bridge
    internal: true    # sin salida a internet ni exposicion: db, cache, storage
  egress:
    driver: bridge    # salida a internet permitida, sin publicar puertos:
                      # techwatcher (APIs publicas) y backup (Cloudflare R2)

services:
  # ---------------------------------------------------------- APLICACION
  web:
    image: registry.edrs.xyz/aprende-devops/web:latest
    container_name: aprende-web
    <<: *base-policy
    networks: [proxy]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.25", memory: "128M" }

  api:
    image: registry.edrs.xyz/aprende-devops/api:latest
    container_name: aprende-api
    <<: *base-policy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Default: Host=postgres;Database=devops_platform;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: aprende-devops
      Jwt__Audience: aprende-devops
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      MinIO__Bucket: devops-platform
      AllowedOrigins__0: https://aprende-devops.edrs.xyz
      Docker__Host: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # LabEngine crea labs como hermanos
      - api-logs:/app/logs
    networks: [proxy, internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: "1G" }

  workers:
    image: registry.edrs.xyz/aprende-devops/workers:latest
    container_name: aprende-workers
    <<: *base-policy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Database=devops_platform;Username=postgres;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Docker__Host: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # jobs de limpieza y regresion de labs
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "512M" }

  techwatcher:
    image: registry.edrs.xyz/aprende-devops/techwatcher:latest
    container_name: aprende-techwatcher
    <<: *base-policy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Database=devops_platform;Username=postgres;Password=${POSTGRES_PASSWORD}
    networks: [internal, egress]    # postgres via internal; APIs externas via egress
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.25", memory: "256M" }

  # ---------------------------------------------------------- DATOS
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aprende-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devops_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "max_connections=100"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [internal]            # jamas publica puerto; admin por tunel SSH
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_platform"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "2.0", memory: "1536M" }

  redis:
    image: redis:7-alpine
    container_name: aprende-redis
    <<: *base-policy
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.25", memory: "128M" }

  minio:
    # RustFS: reemplazo OSS S3-compatible (MinIO retiro sus imagenes publicas en 2025).
    # El nombre del servicio se conserva: la API lo contacta en minio:9000.
    image: rustfs/rustfs:latest
    container_name: aprende-minio
    <<: *base-policy
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [internal]            # consola solo por tunel SSH si se necesita
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "512M" }

  # ---------------------------------------------------------- BACKUPS
  backup:
    build:
      context: ../../backup
    container_name: aprende-backup
    <<: *base-policy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: devops_platform
      RESTIC_REPOSITORY: s3:https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/${R2_BUCKET}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data/minio:ro   # PDFs de certificados y evidencias
    networks: [internal, egress]    # postgres via internal; R2 via egress
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.25", memory: "256M" }

  # ---------------------------------------------------------- OBSERVABILIDAD (perfil obs)
  cadvisor:
    profiles: [obs]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: aprende-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.25", memory: "128M" }

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.53.0
    container_name: aprende-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "512M" }

  grafana:
    profiles: [obs]
    image: grafana/grafana:10.4.1
    container_name: aprende-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks: [internal, proxy]     # exponer via Caddy (grafana.edrs.xyz) cuando se habilite obs
    depends_on: [prometheus]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "512M" }

volumes:
  pg-data:
  redis-data:
  minio-data:
  api-logs:
  prometheus-data:
  grafana-data:
