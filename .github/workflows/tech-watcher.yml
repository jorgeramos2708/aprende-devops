name: Technology Watcher

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
    inputs:
      technology:
        description: 'Specific technology to check (optional)'
        required: false
        type: string

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Restore
        run: dotnet restore ./src/DevOpsPlatform.TechWatcher/DevOpsPlatform.TechWatcher.csproj
      
      - name: Run Watcher
        env:
          ConnectionStrings__Default: ${{ secrets.DB_CONNECTION_STRING }}
          ConnectionStrings__Redis: ${{ secrets.REDIS_CONNECTION_STRING }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./src/DevOpsPlatform.TechWatcher
          dotnet run --configuration Release -- ${{ github.event.inputs.technology }}
      
      - name: Notify on changes
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 Technology Watcher detected changes requiring review',
              body: 'The Technology Watcher job failed or detected high-impact changes. Check the workflow run for details.',
              labels: ['tech-watcher', 'review-needed']
            })
