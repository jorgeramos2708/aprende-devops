# TechWatcher corre como servicio permanente en el VPS (loop interno de 6h).
# Este workflow permite forzar una ejecucion puntual sin entrar al VPS a mano.
name: Technology Watcher (manual)

on:
  workflow_dispatch:
    inputs:
      technology:
        description: 'Tecnologia a revisar (vacio = todas)'
        required: false
        type: string

jobs:
  run-once:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Execute watcher in VPS container
        run: |
          ssh -p 2222 ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "docker exec aprende-techwatcher dotnet DevOpsPlatform.TechWatcher.dll --once '${{ github.event.inputs.technology }}'"
