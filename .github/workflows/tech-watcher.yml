# TechWatcher corre como servicio permanente en el VPS (loop interno de 6h).
# Este workflow permite forzar una ejecucion puntual sin entrar al VPS a mano.
name: Technology Watcher (manual)

on:
  workflow_dispatch:
    inputs:
      technology:
        description: 'Tecnologia a revisar (vacio = todas)'
        required: false
        type: string

jobs:
  run-once:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '${{ secrets.SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Execute watcher in VPS container
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -p 2222 \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "docker exec aprende-techwatcher dotnet DevOpsPlatform.TechWatcher.dll --once '${{ github.event.inputs.technology }}'"
