name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'
  # Registry propio (Zot) en edrs.xyz - DNS only, TLS via Caddy
  REGISTRY: registry.edrs.xyz
  IMAGE_PREFIX: aprende-devops

jobs:
  # ----------------------------------------------------------
  # .NET BACKEND: Build, Test, Publish
  # ----------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          # sin cache: exigiria packages.lock.json (no usamos lock de nuget)

      - name: Restore dependencies
        run: dotnet restore DevOpsPlatform.sln

      - name: Build
        run: dotnet build DevOpsPlatform.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test DevOpsPlatform.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ../test-results

      # Nota: los Dockerfile hacen restore/publish por su cuenta (multi-stage);
      # no se transfieren artefactos entre jobs.

  # ----------------------------------------------------------
  # FRONTEND: Build, Test, Lint
  # ----------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json   # el lockfile no esta en la raiz

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  # ----------------------------------------------------------
  # DOCKER: Build & Push a Zot (registry.edrs.xyz)
  # ----------------------------------------------------------
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Zot registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ZOT_CI_USER }}
          password: ${{ secrets.ZOT_CI_PASSWORD }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:latest

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:latest

      - name: Build and push workers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.workers
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/workers:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/workers:latest

      - name: Build and push techwatcher
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.techwatcher
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/techwatcher:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/techwatcher:latest

  # ----------------------------------------------------------
  # DEPLOY AL VPS (rama main)
  # Requisito en el VPS: repo clonado en /opt/aprende-devops
  # y archivo infra/docker-compose/.env rellenado (ver .env.example)
  # ----------------------------------------------------------
  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy via SSH
        run: |
          # SSH del VPS en puerto 2222; KNOWN_HOSTS generar con: ssh-keyscan -p 2222 <ip>
          # fetch+reset: deploy dir siempre limpio y auto-sanable (.env es ignorado por git)
          ssh -p 2222 ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            set -e
            cd /opt/aprende-devops
            git fetch origin
            git reset --hard origin/main
            cd infra/docker-compose
            docker compose --env-file /opt/aprende-devops/.env -f docker-compose.prod.yml pull
            docker compose --env-file /opt/aprende-devops/.env -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          EOF

      - name: Health check
        run: |
          sleep 30
          curl -fsS https://aprende-devops.edrs.xyz/health || exit 1
