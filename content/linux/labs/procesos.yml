slug: linux-procesos
name: "Linux: procesos y señales"
description: "Localiza el proceso fugitivo y terminalo con la señal adecuada. Practica TERM antes que KILL."
tasks:
  - "Lista procesos con ps aux y localiza el fugitivo (busca 'sleep' en su comando)"
  - "Encuentra su PID exacto con pgrep -f 'while :; do sleep 5'"
  - "Terminalo con kill (señal TERM primero; kill -KILL solo si ignora)"
  - "Escribe la palabra 'terminado' en ~/proceso-terminado.txt como evidencia"
  - "Pulsa Validar"
type: practice
image: registry.edrs.xyz/labs/linux-basic:latest
timeout_seconds: 3600
level: basic
module: operacion
lesson: linux-basic-06-procesos
estimated_minutes: 25
resources:
  cpus: "0.5"
  memory: "512m"
  pids: 100
  network: bridge
setup_script: |
  set -e
  setsid sh -c 'while :; do sleep 5; done' >/dev/null 2>&1 &
  echo "fugitivo en marcha" > /home/lab/reporte-inicial.txt
  chown lab:lab /home/lab/reporte-inicial.txt
validation_script: |
  ok=1
  pgrep -f "while :; do sleep 5" >/dev/null && { echo "FALTA: sigue vivo el proceso fugitivo (localizalo con 'ps aux | grep sleep' y terminalo)"; ok=0; }
  test -f /home/lab/proceso-terminado.txt || { echo "FALTA: deja evidencia: escribe 'terminado' en /home/lab/proceso-terminado.txt tras matarlo"; ok=0; }
  [ $ok -eq 1 ] && echo '{"result":"PASS","message":"Proceso localizado y terminado correctamente"}' && exit 0
  echo '{"result":"FAIL","message":"Revisa las pistas marcadas"}'
  exit 1
